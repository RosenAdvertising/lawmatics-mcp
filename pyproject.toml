[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lawmatics-mcp"
version = "0.1.0"
description = "MCP server for Lawmatics - legal CRM & intake: matters, contacts, tasks, events, notes, forms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["lawmatics", "mcp", "legal", "law", "crm", "intake"]
dependencies = [
    "mcp==2.0.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
lawmatics-mcp = "lawmatics_mcp.server:main"
lawmatics-mcp-setup = "lawmatics_mcp.setup.setup:main"
lawmatics-mcp-verify = "lawmatics_mcp.setup.verify:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["lawmatics_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
